<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Точки КМЗ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A110F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF2F0; --card:#FFFFFF; --soft:#F4F7F5; --line:#DCE3E0;
  --ink:#0F1A17; --ink2:#4B5A55; --mute:#8A9793;
  --brand:#0E5A43; --brand-ink:#FFFFFF; --brand-soft:#DDEDE6;
  --ok:#1F9D6B; --okbg:#E1F4EB; --red:#D8544A; --redbg:#FBE7E4;
  --pay:#2F5FD0; --paybg:#E4EBFB; --amb:#A86A12; --ambbg:#FBF0DC; --warn:#B3271E; --warnbg:#FBE4E0;
  --max:#1F6FF0;
  --shadow:0 1px 2px rgba(15,26,23,.05),0 6px 20px -10px rgba(15,26,23,.18);
  --glass:rgba(238,242,240,.86);
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --d:"Unbounded","Onest",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0A110F; --card:#121B18; --soft:#18231F; --line:#23312C;
  --ink:#EAF1EE; --ink2:#A8B7B1; --mute:#6E7E78;
  --brand:#3FC495; --brand-ink:#06140F; --brand-soft:#15332A;
  --ok:#3FC495; --okbg:#133027; --red:#F0766B; --redbg:#3A1D1A;
  --pay:#8AA8F5; --paybg:#1A2440; --amb:#E6B45E; --ambbg:#33281A; --warn:#F0766B; --warnbg:#3A1D1A;
  --max:#4C8DF6;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -12px rgba(0,0,0,.6);
  --glass:rgba(10,17,15,.86);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;padding-bottom:96px;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);max-width:1280px;margin:0 auto}
/* ---------- sidebar (ПК) ---------- */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 16px 24px 22px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 12px var(--d);letter-spacing:.02em}
.logo b{font:700 17px var(--d);letter-spacing:-.01em;display:block}
.logo span{font-size:12px;color:var(--mute)}
.nl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);padding:0 10px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;border:0;background:none;text-align:left;color:var(--ink2);font-size:15px;transition:background .15s,color .15s}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav .t{flex:1;font-weight:500;line-height:1.25}
.nav .t small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.nav .n{font-size:12px;color:var(--mute)}
.ring{width:26px;height:26px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .b{stroke:var(--line)} .ring .o{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring.full .o{stroke:var(--ok)}
.side-foot{margin-top:auto;font-size:12px;color:var(--mute);padding:0 10px}

/* ---------- шапка ---------- */
.col{min-width:0}
header{position:sticky;top:0;z-index:10;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding:calc(env(safe-area-inset-top) + 18px) 28px 12px;border-bottom:1px solid transparent}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
h1{font:700 26px/1.1 var(--d);letter-spacing:-.02em;margin:5px 0 0}
.date{font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.stats{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center}
.big{font:700 32px/1 var(--d);letter-spacing:-.03em}
.big small{font:500 13px var(--f);color:var(--mute);letter-spacing:0;margin-left:5px}
.sbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.sbar i{display:block;height:100%;width:0;transition:width .4s}
.sbar .ok{background:var(--ok)} .sbar .no{background:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%}
.stat{font-size:14px;color:var(--ink2);margin-top:12px}
.tabs{display:none;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab i{font-style:normal;font-weight:400;opacity:.65;font-size:12px}
.bar{display:flex;gap:8px;margin-top:14px}
.srch{flex:1;min-width:0;position:relative}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.bar input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px 0 42px;font:16px var(--f)}
.bar input::placeholder{color:var(--mute)}
.bar input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
#hide{flex:0 0 auto;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:0 16px;font-size:14px;font-weight:600}
#hide[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- список ---------- */
main{padding:6px 28px 20px}
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:20px 4px 8px}
.hdr{display:flex;width:100%;align-items:center;gap:10px;margin:14px 0 8px;background:var(--soft);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font:600 15px/1 var(--f);color:var(--ink);text-align:left}
.hdr:first-child{margin-top:8px}
.hdr i{font-style:normal;font-weight:500;color:var(--mute);margin-left:auto;font-size:13px}
.hdr .car{color:var(--mute);transition:transform .2s;display:inline-block}
.hdr.on .car{transform:rotate(90deg)}
.rowwrap{background:var(--card);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);transition:opacity .2s}
.rowline{display:flex;align-items:center;gap:6px}
.num{flex:none;width:30px;height:30px;margin-left:14px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink2)}
.s-ok .num{background:var(--okbg);color:var(--ok)}
.s-no .num{background:var(--redbg);color:var(--red)}
.row{flex:1;min-width:0;background:none;border:0;padding:14px 4px 14px 10px;text-align:left;font:inherit;color:inherit}
.row b{font-weight:600;font-size:16.5px;letter-spacing:-.005em;display:block}
.s-ok .row b,.s-no .row b{color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tg{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;line-height:1.35;background:var(--soft);color:var(--ink2)}
.tg.fri{background:var(--ambbg);color:var(--amb)}
.tg.pay,.tg.grp{background:var(--paybg);color:var(--pay)}
.tg.warn{background:var(--warnbg);color:var(--warn)}
.tg.new{background:var(--brand);color:var(--brand-ink)}
.tg.st-ok{background:var(--okbg);color:var(--ok)}
.tg.st-no{background:var(--redbg);color:var(--red)}
.quick{display:flex;gap:8px;padding:10px 12px 10px 0}
.quick button{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--mute);display:grid;place-items:center;transition:all .15s}
.quick button:hover{border-color:var(--mute);color:var(--ink)}
.quick button[aria-pressed=true]{border-color:transparent;color:#fff}
.quick .q-ok[aria-pressed=true]{background:var(--ok)}
.quick .q-no[aria-pressed=true]{background:var(--red)}
.body{padding:4px 16px 16px;border-top:1px solid var(--line)}
.pl{font-size:14.5px;font-weight:500;padding:11px 13px;border-radius:12px;margin:12px 0 0}
.pl.fri{background:var(--ambbg);color:var(--amb);font-weight:600}
.pl.warn{background:var(--warnbg);color:var(--warn)}
.pl.pay{background:var(--paybg);color:var(--pay)}
.link{background:var(--brand-soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:15px}
.link b{font-weight:600;display:block;margin-bottom:4px}
.link .gl{display:flex;flex-wrap:wrap;gap:2px 14px}
.link .gl button{border:0;background:none;color:var(--ink);font:inherit;text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:3px;padding:5px 0;text-align:left}
.ph{margin-top:14px}
.ph small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.ph div{display:flex;flex-wrap:wrap;gap:8px}
.ph a{text-decoration:none;border-radius:12px;font-weight:600;font-size:15px;padding:11px 14px;display:inline-flex;align-items:center}
.ph a.call{background:var(--brand);color:var(--brand-ink);font-size:16px}
.ph a.m{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:10px 13px}
.ph a.max{background:var(--max);color:#fff;border-color:var(--max)}
.none{color:var(--mute);font-size:15px;margin:14px 0 0}
.more{width:100%;margin-top:14px;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:14px 16px;
  font:600 15px/1 var(--f);color:var(--ink);text-align:left;display:flex;justify-content:space-between;align-items:center}
.more span{color:var(--mute);font-weight:500;font-size:13px}
.cat{display:flex;gap:10px;align-items:baseline;margin-top:10px}
.cat h4{margin:0;flex:0 0 86px;font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;line-height:1.6}
.cat div{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;background:var(--soft);color:var(--ink2);border-radius:9px;padding:5px 10px;font-size:14px;line-height:1.25}
.chip.core{background:var(--brand);color:var(--brand-ink);font-weight:500}
.src{font-size:12.5px;color:var(--mute);margin:12px 0 0;line-height:1.5}
.empty{color:var(--mute);font-size:15px;margin:18px 0;padding:34px 20px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.paysec{background:var(--card);border-radius:18px;padding:18px;margin:8px 0 12px;box-shadow:var(--shadow)}
.paysec h3{margin:0 0 4px;font:700 17px var(--d);letter-spacing:-.01em}
.paysec p{margin:0 0 10px;color:var(--mute);font-size:14px}
.paysec button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--line);
  background:none;padding:13px 0;font:500 16px/1.3 var(--f);color:var(--ink);text-align:left}
.paysec button span{color:var(--mute);font-size:13px;font-weight:400;text-align:right}

/* ---------- низ ---------- */
footer{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(to top,var(--bg) 65%,transparent);pointer-events:none}
.dock{max-width:760px;margin:0 auto;display:flex;gap:10px;pointer-events:auto}
footer button{border:0;border-radius:16px;font:600 16px/1 var(--f);height:54px;padding:0 18px}
#rep{flex:1;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 26px -14px var(--brand)}
#rep .pill{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px;font-size:13px}
#clr{background:var(--card);color:var(--ink2);border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:min(460px,calc(100% - 32px));width:max-content;
  background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:14px;font-size:15px;text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.veil{position:fixed;inset:0;z-index:40;background:rgba(5,12,10,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px;padding:22px;margin-bottom:env(safe-area-inset-bottom);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sheet h2{font:700 19px var(--d);margin:0 0 6px;letter-spacing:-.01em}
.sheet p{margin:0 0 16px;color:var(--ink2);font-size:15px}
.sheet .rw{display:flex;gap:10px}
.sheet button{flex:1;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px var(--f)}
.sheet .danger{background:var(--red);border-color:var(--red);color:#fff}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  header{padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
  main{padding:6px 16px 20px}
  .tabs{display:flex}
  h1{font-size:22px}
  .big{font-size:28px}
}
@media (max-width:420px){
  .num{display:none}
  .row{padding-left:14px}
  .quick{gap:6px;padding-right:10px}
  .quick button{width:48px;height:48px}
  .stats{gap:6px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== стиль сайта заказов ===== */
:root{color-scheme:light;
  --bg:#F3F5F8;--card:#FFFFFF;--soft:#EEF1F6;--line:#E1E6EE;
  --ink:#15296A;--ink2:#4A5C8C;--mute:#8C98B8;--head:#12307E;
  --brand:#2350E6;--brand-ink:#FFFFFF;--brand-soft:#E6ECFD;
  --ok:#17875B;--okbg:#E2F4EC;--red:#D8412F;--redbg:#FCE9E4;
  --pay:#2350E6;--paybg:#E6ECFD;--amb:#A86A12;--ambbg:#FFF4DE;--warn:#C2412B;--warnbg:#FCE9E4;
  --shadow:0 1px 2px rgba(12,23,38,.04),0 8px 24px -14px rgba(12,23,38,.22);
  --glass:rgba(243,245,248,.88);
  --f:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--d:var(--f)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#0A0F17;--card:#111823;--soft:#18212E;--line:#222D3C;--ink:#DCE4FF;--ink2:#A5B3D9;--mute:#7482A8;--head:#C9D6FF;
  --brand:#6E8DFF;--brand-ink:#0A0F17;--brand-soft:#1A2547;--ok:#4CC794;--okbg:#10301F;--red:#F0766B;--redbg:#3A1D1A;
  --pay:#8FA8FF;--paybg:#1A2547;--amb:#E6B45E;--ambbg:#33281A;--warn:#F0766B;--warnbg:#3A1D1A;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 30px -14px rgba(0,0,0,.7);--glass:rgba(10,15,23,.88)}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#0A0F17;--card:#111823;--soft:#18212E;--line:#222D3C;--ink:#DCE4FF;--ink2:#A5B3D9;--mute:#7482A8;--head:#C9D6FF;
  --brand:#6E8DFF;--brand-ink:#0A0F17;--brand-soft:#1A2547;--ok:#4CC794;--okbg:#10301F;--red:#F0766B;--redbg:#3A1D1A;
  --pay:#8FA8FF;--paybg:#1A2547;--amb:#E6B45E;--ambbg:#33281A;--warn:#F0766B;--warnbg:#3A1D1A;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 30px -14px rgba(0,0,0,.7);--glass:rgba(10,15,23,.88)}
body,button,input{font-family:var(--f)!important;letter-spacing:-.005em}
h1,.big,.logo b,.paysec h3,.sheet h2{font-family:var(--f)!important;font-weight:800!important;letter-spacing:-.035em!important;color:var(--head)}
h1{font-size:26px}
.big{font-size:34px;color:var(--head)}
.row b,.hdr,.nav .t,.link b,.paysec button,.ph a.call{letter-spacing:-.02em}
.row b,.hdr,.nav button[aria-selected=true] .t,.paysec button{color:var(--head)}
.logo-mark{background:none;box-shadow:0 6px 14px -6px rgba(35,80,230,.6);border-radius:12px;overflow:hidden;padding:0}
.logo-mark img{width:100%;height:100%;display:block}
.eyebrow,.nl{font-weight:700;letter-spacing:.12em;color:color-mix(in srgb,var(--mute) 80%,var(--brand))}
.date{background:var(--card);color:var(--head);font-weight:600;border-color:var(--line)}
.tab[aria-selected=true],#hide[aria-pressed=true]{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 72%,#fff),var(--brand));border-color:transparent;color:var(--brand-ink);box-shadow:0 10px 20px -12px var(--brand)}
.nav button[aria-selected=true]{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 72%,#fff),var(--brand));color:var(--brand-ink);box-shadow:0 12px 22px -14px var(--brand)}
.nav button[aria-selected=true] .t,.nav button[aria-selected=true] .n,.nav button[aria-selected=true] .t small{color:var(--brand-ink)!important}
.nav button[aria-selected=true] .ring .b{stroke:rgba(255,255,255,.3)}.nav button[aria-selected=true] .ring .o{stroke:#fff}
.nav .n{min-width:24px;height:22px;padding:0 7px;border-radius:99px;background:var(--soft);display:grid;place-items:center;font-weight:600}
.nav button[aria-selected=true] .n{background:rgba(255,255,255,.22)}
.stats{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.rowwrap{border-radius:20px}
.quick button{border-radius:14px}
#rep{background:var(--brand);box-shadow:0 14px 28px -14px var(--brand)}
.ph a.call{background:var(--brand);color:var(--brand-ink)}

/* кнопки шапки */
.hbtn{flex:none;width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--head);display:grid;place-items:center}
.hbtn svg{width:20px;height:20px}
.top{gap:10px}
.top .tl{flex:1;min-width:0}
.burger{display:none}

/* боковая панель на телефоне */
.dveil{position:fixed;inset:0;z-index:49;background:rgba(6,10,18,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.theme-seg{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.theme-seg button{flex:1;height:38px;border-radius:10px;border:0;background:none;font-size:13.5px;font-weight:600;color:var(--ink2)}
.theme-seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.dclose{display:none;margin-left:auto}
@media(max-width:900px){
  .burger{display:grid}
  .side{display:flex!important;position:fixed;left:0;top:0;bottom:0;width:min(86vw,330px);height:auto;z-index:50;background:var(--bg);border-right:0;box-shadow:0 24px 70px -20px rgba(12,23,38,.45);transform:translateX(-105%);transition:transform .25s cubic-bezier(.2,.9,.3,1);padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
  .side.open{transform:none}
  .dclose{display:grid}
  .nav button{padding:11px 10px;font-size:16px}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
[hidden]{display:none!important}
@media (min-width:901px){footer{left:max(272px,calc((100vw - 1280px)/2 + 272px))}}
@media (max-width:900px){header{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}}
@media(max-width:480px){.top .date{display:none}}

/* ===== свайп, выбор приветствия, очередь, отчёт ===== */
.rowwrap{position:relative}
.rowline{position:relative;z-index:1;background:var(--card);border-radius:20px;touch-action:pan-y}
.rowwrap::before{content:"";position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;padding:0 22px;font-weight:700;font-size:15px;opacity:0}
.rowwrap[data-sw=ok]::before{content:"✓  Взяли";background:var(--ok);color:#fff;opacity:1;justify-content:flex-start}
.rowwrap[data-sw=no]::before{content:"Не берёт  ✕";background:var(--red);color:#fff;opacity:1;justify-content:flex-end}
.qbtn{width:100%;margin-top:10px;height:46px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.qbtn svg{width:18px;height:18px}
.bs{position:fixed;inset:0;z-index:60;background:rgba(6,10,18,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.bs-c{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -20px 60px -20px rgba(0,0,0,.4);animation:bsup .25s cubic-bezier(.2,.9,.3,1)}
@media(min-width:700px){.bs{align-items:center}.bs-c{border-radius:24px;padding-bottom:18px}}
@keyframes bsup{from{transform:translateY(100%)}}
.bs-g{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.bs-k{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.bs-h{font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--head);margin:4px 0 4px}
.bs-s{font-size:14px;color:var(--ink2);margin:0 0 14px}
.bs-o{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;font-size:15.5px;font-weight:650;color:var(--head);letter-spacing:-.015em}
.bs-o i{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;background:var(--brand-soft)}
.bs-o small{display:block;font-weight:500;font-size:12.5px;color:var(--mute);margin-top:2px}
.bs-o.max i{background:linear-gradient(135deg,#3B82FF,#8A3FFC);color:#fff;font-weight:800;font-size:17px}
.bs-row{display:flex;gap:8px;margin-top:6px}
.bs-row button{flex:1;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;color:var(--head)}
.bs-row .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.bs-row .no{background:var(--red);border-color:var(--red);color:#fff}
.bs-row .pr{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.bs-bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 16px}.bs-bar i{display:block;height:100%;background:var(--brand)}
.bs-tot{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.bs-tot span{font-size:13px;font-weight:700;padding:6px 11px;border-radius:99px}
.bs-tot .a{background:var(--okbg);color:var(--ok)}.bs-tot .b{background:var(--redbg);color:var(--red)}.bs-tot .c{background:var(--soft);color:var(--ink2)}
.bs-pre{white-space:pre-wrap;font:14px/1.55 var(--f);color:var(--head);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;max-height:40vh;overflow:auto}
.bs-chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.bs-chips::-webkit-scrollbar{display:none}
.bs-chips button{flex:none;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--head)}
.bs-chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.rowwrap::before{pointer-events:none;bottom:auto;height:var(--rh,100%)}.rowwrap .body{position:relative;z-index:1;background:var(--card)}.rowwrap:not([data-sw])::before{display:none}
</style>

    const ic = r.id==='pay' ? '<span class="ring"></span>' : n ? ring((n-l)/n) : '';
    return `<button data-t="${r.id}" aria-selected="${r.id===tab && !query}">${ic}<span class="t">${r.name}${r.sub?`<small>${r.sub}</small>`:''}</span>${n?`<span class="n">${l||'✓'}</span>`:''}</button>`; };

function drawProgress(){

  $('#rp').textContent = dn ? dn : '';

function tags(c){
  const t = [];
  if(c.p && c.p.includes('групп')) t.push('<span class="tg grp">в группу</span>');
  if(c.fri) t.push('<span class="tg fri">пятница</span>');
  if(c.r0) t.push(`<span class="tg src">${esc(c.r0)}</span>`);
  const s = siblings(c).length;
  if(s) t.push(`<span class="tg sib">1 номер ×${s+1}</span>`);
  const st = mark(c.n).s;
  if(st) t.push(`<span class="tg st-${st}">${st==='ok'?'взяли':'не берёт'}</span>`);
  if(query) t.push(`<span class="tg src">${esc(c.r)}</span>`);
  return t.length ? `<span class="tags">${t.join('')}</span>` : '';
}

function card(c){
  const F = c.f || [];
  const shown = openPos === c.n;
  const cats = [];
  for(const [cat, lbl, core] of F){
    let g = cats.find(x => x[0] === cat);
    if(!g){ g = [cat, []]; cats.push(g); }
    g[1].push(`<span class="chip${core?' core':''}">${esc(lbl)}</span>`);
  }
  const pos = !shown ? '' : (F.length
    ? cats.map(([cat, ch]) => `<div class="cat"><h4>${esc(cat)}</h4><div>${ch.join('')}</div></div>`).join('')
      + (c.t ? `<p class="src">Тёмным — берёт почти всегда, светлым — иногда. По ${c.t} заявкам с мая${c.t < 6 ? ', данных мало' : ''}.</p>`
             : `<p class="src">Заявок в архиве нет — список из базы, без частоты.</p>`)
    : `<p class="empty">Заявок в архиве нет.</p>`);

  let phones = '';
  if(c.p && c.p.includes('групп')) phones = `<p class="none">Заявку принимают в группе</p>`;
  else if(c.p){
    phones = c.p.split('\n').map((p, i) => {
      const d = p.replace(/\D/g,'');
      if(d.length < 10) return '';
      const w = d.replace(/^8/,'7');
      const who = (c.w||[])[i];
      return `<div class="ph">${who?`<small>${esc(who)}</small>`:''}<div>
        <a class="call" href="tel:${d}">${esc(p)}</a>
        <a class="m max" href="#" data-maxpick="${w}" data-nm="${esc(c.n)}">MAX</a>
        <a class="m" href="whatsapp://send?phone=${w}">WhatsApp</a>
        <a class="m" href="sms:${d}">SMS</a></div></div>`;
    }).join('');
  }
  if(!phones) phones = `<p class="none">Телефона нет</p>`;

  const sib = siblings(c);
  const sibBox = sib.length ? `<div class="link">
      <b>Один номер на ${sib.length+1} ${sib.length+1<5?'точки':'точек'} — спроси сразу по всем</b>
      <div class="gl">${sib.map(s => `<button data-go="${esc(s.n)}">${mark(s.n).s?ICON[mark(s.n).s]:'◻'} ${esc(s.n)}</button>`).join('')}</div>
    </div>` : '';

  return `<div class="body">
    ${c.fri ? `<p class="pl fri">Заявка только на пятницу</p>` : ''}
    ${c.note ? `<p class="pl warn">${esc(c.note)}</p>` : ''}
    ${sibBox}
    ${phones}
    <button class="more" data-pos="${esc(c.n)}">Что берёт<span>${F.length?F.length+' поз.':'нет данных'} ${shown?'▲':'▼'}</span></button>
    ${pos}
  </div>`;
}

function row(c){

    <div class="rowline">
      ${c.i ? `<span class="num">${c.i}</span>` : ''}
      <button class="row" data-open="${esc(c.n)}"><b>${esc(c.n)}</b>${tags(c)}</button>

        <button class="q-no" data-s="no" data-n="${esc(c.n)}" aria-pressed="${m.s==='no'}" aria-label="Не взял"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

    </div>

function payView(){
  const sun = ALL.filter(c => c.pay && !c.pay.startsWith('Акт'));
  const act = ALL.filter(c => c.pay && c.pay.startsWith('Акт'));
  const grp = [];
  for(const c of sun){
    const k = c.n.split(' ')[0];
    let g = grp.find(x => x.k === k);
    if(!g){ g = {k, first:c.n, pay:c.pay, n:0, one:c.n}; grp.push(g); }
    g.n++;
  }
  grp.sort((a,b) => a.k.localeCompare(b.k,'ru'));
  const btn = g => `<button data-go="${esc(g.first)}">${esc(g.n>1 ? g.k : g.one)}<span>${esc(g.pay.replace('Вс — ',''))}${g.n>1?`, ${g.n} ${g.n<5?'точки':'точек'}`:''}</span></button>`;
  return `<div class="paysec"><h3>Воскресенье</h3><p>Скинуть на оплату или дождаться платёжки</p>${grp.map(btn).join('')}</div>
    <div class="paysec"><h3>Каждый месяц</h3><p>Акт сверки в ЭДО</p>
      <button data-go="Курпитко Карасунская">Курпитко Е.Н.<span>все точки, ${act.filter(c=>c.n.startsWith('Курпитко')).length}</span></button>
      ${act.filter(c => !c.n.startsWith('Курпитко')).map(c => `<button data-go="${esc(c.n)}">${esc(c.n)}<span>3 юрлица</span></button>`).join('')}
    </div>`;
}

function draw(){
  drawTabs(); drawProgress();
  if(tab === 'pay' && !query){ $('#list').innerHTML = payView(); return; }
  let list = clients();
  if(hideDone) list = list.filter(c => c.hdr || !mark(c.n).s || c.n === openName);
  // на вкладке маршрута: сначала неотмеченные, отмеченные — ниже отдельным блоком
  const split = tab !== 'all' && !query.trim();
  let html;
  if(split){
    const open = list.filter(c => !mark(c.n).s), done = list.filter(c => mark(c.n).s);
    html = open.map(row).join('') + (done.length ? `<div class="sec">Отмечено · ${done.length}</div>` + done.map(row).join('') : '');
  } else html = list.map(c => c.hdr
      ? `<button class="hdr${c.on?' on':''}" data-fold="${c.rid}"><span class="car">›</span> ${esc(c.hdr)}<i>${c.info}</i></button>`
      : row(c)).join('');
  $('#list').innerHTML = list.length ? html
    : `<p class="empty">${hideDone ? 'Все точки отмечены 👍' : 'Ничего не нашлось. Попробуй часть названия — «кутк», «анап» или «пятница».'}</p>`;
}

document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if(cp){ const v = '+'+cp.dataset.copy; try{ navigator.clipboard.writeText(v); }catch(err){} toast('Номер '+v+' скопирован — если чата нет, найди по номеру'); }
  const t = e.target.closest('[data-t]');
  if(t){ tab = t.dataset.t; openName = null; openPos = null; query=''; $('#q').value=''; draw(); scrollTo(0,0); return; }
  const fd = e.target.closest('[data-fold]');
  if(fd){ const id = fd.dataset.fold; openRoutes.has(id) ? openRoutes.delete(id) : openRoutes.add(id); draw(); return; }
  const o = e.target.closest('[data-open]');
  if(o){ openName = openName === o.dataset.open ? null : o.dataset.open; openPos = null; draw(); return; }
  const p = e.target.closest('[data-pos]');
  if(p){ openPos = openPos === p.dataset.pos ? null : p.dataset.pos; draw(); return; }
  const g = e.target.closest('[data-go]');
  if(g){ goTo(g.dataset.go); return; }
  const b = e.target.closest('[data-s]');
  if(b){ const n = b.dataset.n; setMark(n, mark(n).s === b.dataset.s ? null : b.dataset.s); save(); draw(); return; }
});

$('#rep').onclick = async () => {
  const lines = ['Отчёт · '+state.date]; let any = false;
  for(const r of DATA.routes){
    const marked = r.cl.filter(c => mark(c.n).s);
    if(!marked.length) continue; any = true;
    lines.push('', r.name);
    for(const k of ['ok','no']){
      const g = marked.filter(c => mark(c.n).s === k);
      if(g.length) lines.push(ICON[k]+' '+ST[k]+' ('+g.length+'): ' + g.map(c => c.n).join('; '));
    }
    const left = r.id === 'etc' ? [] : r.cl.filter(c => !mark(c.n).s);
    if(left.length) lines.push('без отметки ('+left.length+'): ' + left.map(c => c.n).join('; '));
  }
  if(!any){ toast('Пока нечего отправлять — отметь хотя бы одну точку'); return; }
  const txt = lines.join('\n');
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Отчёт скопирован — вставь в MAX');
};

function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function copyTxt(t){try{navigator.clipboard.writeText(t)}catch(e){}}
function sheet(html){closeSheet();const v=document.createElement('div');v.className='bs';v.id='bs';v.innerHTML='<div class="bs-c"><div class="bs-g"></div>'+html+'</div>';v.addEventListener('click',e=>{if(e.target===v)closeSheet()});document.body.appendChild(v);return v;}

 v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=greetOrder()[+b.dataset.g][1];closeSheet();openMax(g,phone);});}

 function show(){if(i>=L.length){closeSheet();toast('Очередь пройдена');draw();return;}const c=L[i],ph=firstPhone(c),grp=c.p&&c.p.includes('групп');

function repText(id){const routes=DATA.routes.filter(r=>id==='all'?true:r.id===id);const L=[];let T={ok:0,no:0,left:0};
 routes.forEach(r=>{const x=repRoute(r);if(id==='all'&&!x.ok.length&&!x.no.length&&(r.id==='etc'))return;T.ok+=x.ok.length;T.no+=x.no.length;T.left+=x.left.length;
  L.push('',r.name+(r.sub?' ('+r.sub+')':'')+' — '+x.ok.length+' / '+x.no.length+' / '+x.left.length);
  if(x.ok.length)L.push('✅ взяли ('+x.ok.length+'): '+x.ok.map(c=>c.n).join('; '));
  if(x.no.length)L.push('❌ не берут ('+x.no.length+'): '+x.no.map(c=>c.n).join('; '));
  if(x.left.length)L.push('⏳ не ответили ('+x.left.length+'): '+x.left.map(c=>c.n).join('; '));});
 const head=['Отчёт · '+state.date+' · '+(id==='all'?'все маршруты':routes[0].name),'Итого: взяли '+T.ok+' · не берут '+T.no+' · не ответили '+T.left];
 return{txt:head.concat(L).join('\n'),T};}
function openReport(id){id=id||'all';const R=repText(id);const opts=[{id:'all',name:'Все маршруты'}].concat(DATA.routes.map(r=>({id:r.id,name:r.name})));
 const v=sheet('<div class="bs-k">Отчёт за '+state.date+'</div><div class="bs-h">Отчёт</div><div class="bs-chips">'+opts.map(o=>'<button data-r="'+o.id+'" aria-pressed="'+(o.id===id)+'">'+esc(o.name)+'</button>').join('')+'</div><div class="bs-tot"><span class="a">Взяли '+R.T.ok+'</span><span class="b">Не берут '+R.T.no+'</span><span class="c">Не ответили '+R.T.left+'</span></div><pre class="bs-pre">'+esc(R.txt)+'</pre><div class="bs-row"><button data-a="copy">Скопировать</button><button class="pr" data-a="max">Отправить в MAX</button></div>');
 v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openReport(b.dataset.r));
 v.querySelector('[data-a=copy]').onclick=()=>{copyTxt(R.txt);toast('Отчёт скопирован');};
 v.querySelector('[data-a=max]').onclick=()=>{copyTxt(R.txt);openMax(R.txt);};}
$('#rep').onclick=()=>openReport(tab!=='all'&&tab!=='pay'&&DATA.routes.some(r=>r.id===tab)?tab:'all');
document.addEventListener('click',e=>{if(e.target.closest('#qbtn'))runQueue();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

draw();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
