<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Рейс водителя · КМЗ №1">
<meta property="og:description" content="Точки доставки в порядке объезда">
<title>Рейс водителя · КМЗ №1</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:light;--ink:#172638;--muted:#48596a;--line:#dbe4ed;--accent:#1454a2;--tint:#eef5ff;--surface:#fff;--bg:#f2f6fa;--ok:#16613c;--fail:#992d1e}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0;font:17px/1.45 system-ui,sans-serif}
main{width:min(100% - 24px,680px);margin:0 auto;padding:20px 0 36px}
header{padding:6px 5px 12px}.brand,.eyebrow{color:var(--accent);font-weight:750;font-size:.87rem;letter-spacing:.025em}
h1{margin:.25rem 0 .35rem;font-size:clamp(1.45rem,6vw,2rem);line-height:1.15}
h2,h3{line-height:1.22;margin:0;overflow-wrap:anywhere}
p{margin:.4rem 0;color:var(--muted);overflow-wrap:anywhere}
progress{appearance:none;width:100%;height:8px;border:0;border-radius:10px;background:#dfe9f4;overflow:hidden;display:block;margin-top:12px}
progress::-webkit-progress-bar{background:#dfe9f4}
progress::-webkit-progress-value{background:var(--accent);border-radius:10px}
progress::-moz-progress-bar{background:var(--accent);border-radius:10px}
#next:not(:empty),#routeList{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
#next:not(:empty){border-top:4px solid var(--accent);box-shadow:0 4px 20px #112b480a}
#next h2{font-size:1.2rem;margin-top:.3rem}.address{font-size:1.02rem;font-weight:650;color:var(--ink)}
#next .address{font-size:clamp(1.3rem,6vw,1.78rem);line-height:1.2;margin:.55rem 0 .75rem}.note{white-space:pre-wrap;padding:8px 11px;background:var(--tint);border-radius:8px}
a,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:9px;font:inherit;text-align:center;text-decoration:none;overflow-wrap:anywhere;background:#f7f9fc;color:var(--ink);border:1px solid var(--line);cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions>*{flex:1 1 auto}
.photoButton img{width:52px;height:42px;object-fit:cover;border-radius:6px}.photoButton span{min-width:0}
.actions input{width:100%;min-width:0;min-height:44px;font:inherit;padding:8px;border:1px solid #9baac0;border-radius:8px}
.inline-menu{margin-top:8px}.inline-menu summary{display:list-item;padding:8px 2px}.inline-menu .actions>*{flex:0 1 auto}
summary{cursor:pointer;min-height:44px;padding:11px 0;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
#routeList{margin-top:14px;padding-block:4px}
#stops{list-style:none;padding:0;margin:0 0 8px}
#stops>li{border-top:1px solid var(--line);padding:12px 0}
#stops h3{font-size:1.04rem}
#stops .completed{padding-block:3px}
.completed summary{font-size:.95rem}
.doneTag{color:var(--ok);font-weight:700}.failTag{color:var(--fail);font-weight:700}
.listNote,.subtle{font-size:.9rem}.listNote{display:block;color:var(--muted);font-weight:500}
#report:empty{display:none}#report{margin-top:8px;color:var(--fail);font-weight:650;overflow-wrap:anywhere}
#photoDialog{width:min(calc(100% - 24px),730px);max-height:calc(100% - 24px);padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--surface)}
#photoDialog::backdrop{background:#101d32c4}#photoDialog button{display:flex;margin:0 0 8px auto}
#photoDialog img{display:block;max-width:100%;max-height:76vh;object-fit:contain;margin:auto}
@media(max-width:380px){#next:not(:empty),#routeList{padding-inline:12px}a,button{padding-inline:9px}}
</style>
<script src="./driver.js" defer></script>
</head>
<body>
<main>
<header><strong class="brand">КМЗ №1</strong><h1 id="title">Рейс водителя</h1><p id="previewLabel" class="eyebrow" hidden>Предпросмотр · отметки не сохраняются</p><p id="summary" role="status">Загружаю рейс…</p><progress id="progress" aria-label="Сдано точек" hidden></progress></header>
<section id="next" aria-label="Следующая точка"></section>
<p id="report" role="status"></p>
<details id="routeList" hidden><summary id="routeSummary">Все точки по порядку</summary><ol id="stops" aria-label="Все точки рейса"></ol></details>
<dialog id="photoDialog" aria-label="Фото места выгрузки"><form method="dialog"><button>Закрыть фото</button></form><img id="fullPhoto" alt=""></dialog>
<noscript><p>Включите JavaScript, чтобы открыть рейс.</p></noscript>
</main>
</body>
</html>
